server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # 后台接口目前直接挂载在根路径。这里仅代理已存在的 API，
    # 其余 GET 请求继续交给 Vue Router，保证刷新深层路由不会 404。
    location ~ ^/(?:health|isRegister|register|signin|overview|visits|survey|comment|deleteComment|message|deleteMessage|article|changeArticleState|deleteArticle|articleState|category|addCategory|updateCategoryName|deleteCategory|label|addLabel|deleteLabel|file|deleteFile|moveFile|diary|createDiary|createArticle|gainArticle|updateArticle|weather|uploadFile|profile|public|files)(?:/|$) {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
