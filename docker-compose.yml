name: blog-platform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  blog:
    build:
      context: ./blog
      args:
        VITE_API_BASE_URL: /
    ports:
      - "${BLOG_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    restart: unless-stopped
    logging: *default-logging

  admin:
    build:
      context: ./blogMangagement
      args:
        VITE_API_BASE_URL: /
    ports:
      - "${ADMIN_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    restart: unless-stopped
    logging: *default-logging

  backend:
    build:
      context: ./serve
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: "${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}"
      DB_USER: "${MYSQL_USER:?Set MYSQL_USER in .env}"
      DB_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      DB_LOGGING: "false"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      ADMIN_INITIAL_USER: "${ADMIN_INITIAL_USER:-tom}"
      ADMIN_INITIAL_PASSWORD: "${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in .env}"
      RUSTFS_INTERNAL_ENDPOINT: "http://rustfs:9000"
      RUSTFS_PUBLIC_ENDPOINT: "${RUSTFS_PUBLIC_ENDPOINT}"
      RUSTFS_BUCKET: "${RUSTFS_BUCKET:-blog-files}"
      RUSTFS_REGION: "${RUSTFS_REGION:-us-east-1}"
      RUSTFS_FORCE_PATH_STYLE: "true"
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY}"
      RUSTFS_CORS_ORIGIN: "${RUSTFS_CORS_ORIGIN}"
    volumes:
      - uploads:/app/public/files
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - edge
      - data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *default-logging

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}"
      MYSQL_USER: "${MYSQL_USER:?Set MYSQL_USER in .env}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"
      TZ: "${TZ:-Asia/Shanghai}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    logging: *default-logging

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:?Set RUSTFS_ACCESS_KEY in .env}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:?Set RUSTFS_SECRET_KEY in .env}"
    # Only loopback is exposed. The backend reaches RustFS through the data network.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    networks:
      - data
      - edge
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    networks:
      - data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

networks:
  edge:
  data:
    internal: true

volumes:
  mysql_data:
  uploads:
  rustfs_data:
  redis_data:
